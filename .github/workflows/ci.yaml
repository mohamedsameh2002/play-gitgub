#=============================================================
# 3. publish to aws ecr
#=============================================================
  publish:
    name: Publish Docker Image to ECR

    runs-on: ubuntu-latest

    needs:
      - test
      - docker
    
    steps:

      - name: Checkout repository
        uses: actions/checkout@v7


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::358592703668:role/GitHubActions-ECR-Push++
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image variables
        run: |
          echo "ECR_REGISTRY=${{ steps.ecr-login.outputs.registry }}" >> "$GITHUB_ENV"
          echo "IMAGE_URI=${{ steps.ecr-login.outputs.registry }}/${ECR_REPOSITORY}" >> "$GITHUB_ENV"

      # ------------------------------------------------------
      # Build production image
      # ------------------------------------------------------
      - name: Build Docker image
        run: |
          docker build \
            --tag "$IMAGE_URI:${GITHUB_SHA}" \
            --tag "$IMAGE_URI:latest" \
            .

      # ------------------------------------------------------
      # Push image to ECR
      # ------------------------------------------------------
      - name: Push Docker image
        if: success()
        run: |
          docker push "$IMAGE_URI:${GITHUB_SHA}"
          docker push "$IMAGE_URI:latest"

      # ------------------------------------------------------
      # Show published image
      # ------------------------------------------------------
      - name: Show published image
        if: success()
        run: |
          echo "Published:"
          echo "$IMAGE_URI:${GITHUB_SHA}"
          echo "$IMAGE_URI:latest"
      

