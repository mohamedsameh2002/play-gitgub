name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  APP_NAME: github-actions-demo
  ECR_REPOSITORY: github-actions-demo
  AWS_REGION: us-east-1
  PYTHONUNBUFFERED: "1"

jobs:
  #=============================================================
  # 1. test
  #=============================================================
  test:
    name: Test - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Set CI environment
        run: |
          echo "CI_PYTHON_VERSION=${{ matrix.python-version }}" >> "$GITHUB_ENV"
          echo "BUILD_ID=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Verify environment
        run: |
          echo "Application: $APP_NAME"
          echo "Python: $CI_PYTHON_VERSION"
          echo "Build ID: $BUILD_ID"

          python --version
          pip --version

      - name: Validate Python syntax
        run: |
          python -m compileall -q .

      - name: Run Ruff
        run: |
          ruff check .

      - name: Run application tests
        run: |
          python - <<'PY'
          from app import app

          client = app.test_client()

          response = client.get("/")
          assert response.status_code == 200
          assert response.data.decode() == "GitHub Actions CI/CD Demo"

          response = client.get("/health")
          assert response.status_code == 200
          assert response.json == {"status": "healthy"}

          print("Application tests passed.")
          PY
      - name: Start application
        run: |
          nohup python app.py > app.log 2>&1 &
          echo $! > app.pid

      - name: Health check
        if: success()
        run: |
          for i in {1..10}; do
            if curl --fail --silent http://127.0.0.1:5000/health; then
              echo
              echo "Application is healthy."
              exit 0
            fi

            echo "Waiting for application..."
            sleep 2
          done

          echo "Application failed health check."
          exit 1

      - name: Show application logs
        if: failure()
        run: |
          echo "===== Application Logs ====="
          cat app.log || true

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: app-logs-python-${{ matrix.python-version }}
          path: app.log
          if-no-files-found: ignore

